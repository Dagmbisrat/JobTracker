name: Email Monitor
on:
  schedule:
    - cron: "0 13 * * 1" # Runs weekly, Mondays 13:00 UTC
  workflow_dispatch: # Allows manual triggering

jobs:
  monitor-emails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install dependencies
        working-directory: ./server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compute email cutoff (7 days ago)
        run: echo "EMAIL_SINCE=$(LC_ALL=C date -u -d '7 days ago' +%d-%b-%Y)" >> "$GITHUB_ENV"

      - name: Run email monitor
        env:
          DB_API_ADDY: ${{ secrets.DB_API_ADDY }}
          API_KEY: ${{ secrets.API_KEY }}
          MODEL: ${{ secrets.MODEL }}
        working-directory: ./server
        run: python EmailMonitor.py
